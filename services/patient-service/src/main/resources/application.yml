spring:
  application:
    name: patient-service

  datasource:
    url: jdbc:postgresql://localhost:5432/hospital_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8081
 
management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

  info:
    env:
      enabled: true

info:
  app:
    name: patient-service
    description: Hospital Management Patient Service
    version: 0.0.1-SNAPSHOT

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ 
