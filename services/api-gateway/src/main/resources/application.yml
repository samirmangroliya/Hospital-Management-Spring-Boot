spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patient-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/patients/**
            - id: doctor-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/doctors/**
            - id: appointment-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/appointments/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - gateway
          

  endpoint:
    health:
      probes:
        enabled: true

  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Hospital Management API Gateway
    version: 0.0.1-SNAPSHOT

logging:
  level:
    org.springframework.cloud.gateway: DEBUG