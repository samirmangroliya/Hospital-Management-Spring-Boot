spring:
  application:
    name: appointment-service

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true

  info:
    env:
      enabled: true

info:
  app:
    name: appointment-service
    description: Hospital Management Appointment Service
    version: 0.0.1-SNAPSHOT

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/