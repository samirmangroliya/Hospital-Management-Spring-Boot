services:

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:18
    container_name: hospital-postgres
    restart: unless-stopped

    networks:
      - hospital-net

    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${PATIENT_DB:?PATIENT_DB is required}

    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ============================================================
  # Kafka
  # ============================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hospital-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - hospital-net
    depends_on:
      - zookeeper   

  # ============================================================
  # Create application databases
  # ============================================================
  postgres-init:
    image: postgres:18
    container_name: hospital-postgres-init
    restart: "no"

    networks:
      - hospital-net

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${DB_USERNAME:?DB_USERNAME is required}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      PATIENT_DB: ${PATIENT_DB:?PATIENT_DB is required}
      DOCTOR_DB: ${DOCTOR_DB:?DOCTOR_DB is required}
      APPOINTMENT_DB: ${APPOINTMENT_DB:?APPOINTMENT_DB is required}

    entrypoint:
      - /bin/bash
      - -c

    command:
      - |
        set -e

        echo "Checking application databases..."

        for DB in "$${PATIENT_DB}" "$${DOCTOR_DB}" "$${APPOINTMENT_DB}"; do

          if ! psql -d postgres -tAc \
            "SELECT 1 FROM pg_database WHERE datname='$${DB}'" | grep -q 1; then

            echo "Creating database: $${DB}"

            psql -d postgres \
              -c "CREATE DATABASE \"$${DB}\""

          else

            echo "Database already exists: $${DB}"

          fi

        done

        echo "Database initialization completed."

  # ============================================================
  # Eureka Server
  # ============================================================
  eureka-server:
    build:
      context: .
      dockerfile: services/eureka-server/Dockerfile

    container_name: hospital-eureka
    restart: unless-stopped

    networks:
      - hospital-net

    ports:
      - "${EUREKA_PORT}:8761"


  # ============================================================
  # Patient Service
  # ============================================================
  patient-service:
    build:
      context: .
      dockerfile: services/patient-service/Dockerfile

    container_name: hospital-patient-service
    restart: unless-stopped

    networks:
      - hospital-net

    ports:
      - "${PATIENT_SERVICE_PORT}:8081"

    depends_on:
      postgres-init:
        condition: service_completed_successfully

      eureka-server:
        condition: service_started

      jaeger:
        condition: service_started

    environment:
      PATIENT_DB_URL: ${PATIENT_DB_URL:?PATIENT_DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      EUREKA_URL: ${EUREKA_URL:?EUREKA_URL is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}

      OTEL_ENDPOINT: ${OTEL_ENDPOINT:?OTEL_ENDPOINT is required}
      OTEL_METRICS_ENDPOINT: ${OTEL_METRICS_ENDPOINT:?OTEL_METRICS_ENDPOINT is required}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVER:?KAFKA_BOOTSTRAP_SERVER is required}

  # ============================================================
  # Doctor Service
  # ============================================================
  doctor-service:
    build:
      context: .
      dockerfile: services/doctor-service/Dockerfile

    container_name: hospital-doctor-service
    restart: unless-stopped

    networks:
      - hospital-net

    ports:
      - "${DOCTOR_SERVICE_PORT}:8082"

    depends_on:
      postgres-init:
        condition: service_completed_successfully

      eureka-server:
        condition: service_started

      jaeger:
        condition: service_started

    environment:
      DOCTOR_DB_URL: ${DOCTOR_DB_URL:?DOCTOR_DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      EUREKA_URL: ${EUREKA_URL:?EUREKA_URL is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}

      OTEL_ENDPOINT: ${OTEL_ENDPOINT:?OTEL_ENDPOINT is required}
      OTEL_METRICS_ENDPOINT: ${OTEL_METRICS_ENDPOINT:?OTEL_METRICS_ENDPOINT is required}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVER:?KAFKA_BOOTSTRAP_SERVER is required}

  # ============================================================
  # Appointment Service
  # ============================================================
  appointment-service:
    build:
      context: .
      dockerfile: services/appointment-service/Dockerfile

    container_name: hospital-appointment-service
    restart: unless-stopped

    networks:
      - hospital-net

    ports:
      - "${APPOINTMENT_SERVICE_PORT}:8083"

    depends_on:
      postgres-init:
        condition: service_completed_successfully

      eureka-server:
        condition: service_started

      jaeger:
        condition: service_started

    environment:
      APPOINTMENT_DB_URL: ${APPOINTMENT_DB_URL:?APPOINTMENT_DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

      EUREKA_URL: ${EUREKA_URL:?EUREKA_URL is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}

      OTEL_ENDPOINT: ${OTEL_ENDPOINT:?OTEL_ENDPOINT is required}
      OTEL_METRICS_ENDPOINT: ${OTEL_METRICS_ENDPOINT:?OTEL_METRICS_ENDPOINT is required}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVER:?KAFKA_BOOTSTRAP_SERVER is required}

  # ============================================================
  # API Gateway
  # ============================================================
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile

    container_name: hospital-api-gateway
    restart: unless-stopped

    networks:
      - hospital-net

    ports:
      - "${API_GATEWAY_PORT}:8080"

    depends_on:
      eureka-server:
        condition: service_started

      jaeger:
        condition: service_started

    environment:
      EUREKA_URL: ${EUREKA_URL:?EUREKA_URL is required}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}

      OTEL_ENDPOINT: ${OTEL_ENDPOINT:?OTEL_ENDPOINT is required}
      OTEL_METRICS_ENDPOINT: ${OTEL_METRICS_ENDPOINT:?OTEL_METRICS_ENDPOINT is required}

  # ============================================================
  # Notification Service
  # ============================================================
  notification-db:
    image: mongo:latest
    container_name: hospital-notification-db
    restart: unless-stopped
    networks:
      - hospital-net
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: hospital-notification-service
    restart: unless-stopped
    networks:
      - hospital-net
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8084}:8084"
    depends_on:
      notification-db:
        condition: service_started
      eureka-server:
        condition: service_started
      jaeger:
        condition: service_started
      kafka: # 👈 Ensures it boots after your Kafka broker engine goes live
        condition: service_started  
    environment:
      PORT: 8084
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required}
      
      # Discovery & Service Registry
      EUREKA_URL: ${EUREKA_URL:?EUREKA_URL is required}
      
      # Observability / Distributed Tracing
      OTEL_ENDPOINT: ${OTEL_ENDPOINT:?OTEL_ENDPOINT is required}
      OTEL_METRICS_ENDPOINT: ${OTEL_METRICS_ENDPOINT:?OTEL_METRICS_ENDPOINT is required}
 
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVER:?KAFKA_BOOTSTRAP_SERVER is required}


  # # ============================================================
  # # Jaeger
  # # ============================================================
  # jaeger:
  #   image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
  #   container_name: hospital-jaeger
  #   restart: unless-stopped

  #   networks:
  #     - hospital-net

  #   ports:
  #     - "${JAEGER_UI_PORT}:16686"
  #     - "${JAEGER_OTLP_GRPC_PORT}:4317"
  #     - "${JAEGER_OTLP_HTTP_PORT}:4318"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: hospital-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-col/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-col/config.yaml
    networks:
      - hospital-net
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: hospital-jaeger
    restart: unless-stopped
    networks:
      - hospital-net
    ports:
      - "16686:16686" # Jaeger Web UI Interface

  prometheus:
    image: prom/prometheus:latest
    container_name: hospital-prometheus
    restart: unless-stopped
    networks:
      - hospital-net
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: hospital-grafana
    restart: unless-stopped
    networks:
      - hospital-net
    ports:
      - "3000:3000" # Open http://localhost:3000 on your Mac
    depends_on:
      - prometheus

volumes:
  postgres_data:
  mongo-data:


networks:
  hospital-net:
    driver: bridge